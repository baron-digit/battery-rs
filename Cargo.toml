[package]
name = "battery-rs"
version = "0.1.0-alpha.3"
edition = "2024"
rust-version = "1.85"

authors = ["Dennis Berner <dennis@digitlabs.com>"]

description = "An open framework for battery software engineering."

license = "MIT OR Apache-2.0"

repository = "https://github.com/baron-digit/battery-rs"
homepage = "https://github.com/baron-digit/battery-rs"
documentation = "https://docs.rs/battery-rs"

readme = "README.md"

keywords = ["battery", "bms", "embedded", "energy", "validation"]
categories = ["embedded", "science"]

include = ["src/**", "examples/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "CHANGELOG.md"]

[features]
default = ["std"]
std = []

[dependencies]
